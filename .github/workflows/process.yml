name: Automated Media Processing Pipeline

on:
  repository_dispatch:
    types: [process_video, sync_supabase]
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action Type (process_video or sync_supabase)'
        required: false
        default: 'process_video'
        type: string
      tmdb_id:
        description: 'TMDb Movie/Show ID (e.g. 157336)'
        required: true
        type: string
      source_url:
        description: 'Direct Source Video URL, Embed Link, or HLS .m3u8'
        required: false
        type: string
      stream_url:
        description: 'Stream URL for Supabase sync'
        required: false
        type: string
      download_url:
        description: 'Download URL for Supabase sync'
        required: false
        type: string

jobs:
  process-and-ingest:
    name: Transcode & Ingest Media (Hyper-Speed MTProto 2GB)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ffmpeg & aria2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2

      - name: Verify CLI Tools
        run: |
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1

      - name: Install Python Packages (Inline Installation)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests telethon cryptg supabase yt-dlp

      - name: Execute Media Processing Engine
        env:
          ACTION_TYPE: ${{ github.event.action || github.event.inputs.action_type || 'process_video' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ID: ${{ github.event.client_payload.tmdb_id || github.event.inputs.tmdb_id }}
          SOURCE_URL: ${{ github.event.client_payload.source_url || github.event.inputs.source_url }}
          STREAM_URL: ${{ github.event.client_payload.stream_url || github.event.inputs.stream_url }}
          DOWNLOAD_URL: ${{ github.event.client_payload.download_url || github.event.inputs.download_url }}
        run: |
          python process.py
