name: Pixeldrain Cloud Ingest Pipeline

on:
  repository_dispatch:
    types: [process_video, sync_supabase]
  workflow_dispatch:
    inputs:
      source_url:
        description: '3rd-Party Movie Download Link or Video Stream'
        required: true
        type: string
      tmdb_id:
        description: 'TMDb Movie ID (e.g. 157336)'
        required: false
        default: '157336'
        type: string
      movie_title:
        description: 'Movie Title'
        required: false
        type: string

jobs:
  ingest-to-pixeldrain:
    name: Download & Ingest to Pixeldrain
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (aria2c & curl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 curl

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pixeldrain Ingest Engine
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url || github.event.inputs.source_url }}
          TMDB_ID: ${{ github.event.client_payload.tmdb_id || github.event.inputs.tmdb_id || '157336' }}
          MOVIE_TITLE: ${{ github.event.client_payload.movie_title || github.event.inputs.movie_title }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY || '1d5668c3-d5f4-44ef-8665-93e5c683a724' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -u process.py
