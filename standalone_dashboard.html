<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Engine</title>
  <meta name="description" content="Automated media processing control dashboard for GitHub Actions video transcode and Supabase/Telegram ingest pipelines." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between selection:bg-indigo-500/30">
  
  <!-- Status Toast Notification -->
  <div id="toastBox" class="fixed top-4 inset-x-4 max-w-lg mx-auto z-50 hidden transition-all">
    <div id="toastContent" class="p-4 rounded-xl border shadow-2xl backdrop-blur-md bg-slate-900/95 flex items-start gap-3">
      <div id="toastIcon" class="mt-0.5 flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <h4 id="toastTitle" class="font-semibold text-sm text-white"></h4>
          <button id="toastClose" class="text-slate-400 hover:text-white p-1">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <p id="toastMessage" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
        <div id="toastAction" class="hidden mt-2">
          <a id="toastLink" href="#" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium inline-flex items-center gap-1">
            View in GitHub Actions &rarr;
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-950/70 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
          </svg>
        </div>
        <h1 class="font-semibold text-sm text-white tracking-tight">Media Engine</h1>
      </div>

      <div class="flex items-center gap-2 text-xs text-slate-400 font-mono">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Connected</span>
      </div>
    </div>
  </header>

  <!-- Main Content - Only the 2 requested inputs -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 sm:py-16 flex flex-col justify-center gap-6">
    <!-- Input 1: Direct Video / Stream URL -->
    <section class="bg-slate-900/80 border border-slate-800/90 rounded-2xl p-6 sm:p-7 shadow-xl">
      <form id="videoForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
            Direct Video / Stream URL
          </label>
          <input type="url" id="sourceUrl" placeholder="https://example.com/video_source.mp4" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono" />
        </div>

        <div class="flex items-center justify-between pt-1">
          <span class="text-xs text-slate-400">Transcodes to H.265 and uploads to Telegram</span>
          <button type="submit" id="processBtn" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl transition-colors text-sm shadow-lg shadow-indigo-600/25 flex items-center gap-2">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Generate / Process</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Input 2: TMDb Movie / Show ID -->
    <section class="bg-slate-900/80 border border-slate-800/90 rounded-2xl p-6 sm:p-7 shadow-xl">
      <form id="tmdbForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
            </svg>
            TMDb Movie / Show ID
          </label>
          <input type="text" id="tmdbId" placeholder="e.g. 157336 (Interstellar)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono" />
        </div>

        <div class="flex items-center justify-between pt-1">
          <span class="text-xs text-slate-400">Fetches metadata and links to Supabase</span>
          <button type="submit" id="tmdbBtn" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-white font-medium py-2.5 px-6 rounded-xl transition-colors border border-slate-700 text-sm">
            <span>Submit to Database</span>
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/60 bg-slate-950 py-4">
    <div class="max-w-3xl mx-auto px-4 flex items-center justify-between text-xs text-slate-400">
      <span>Target: <code class="text-slate-300 font-mono">mr5353504-cyber/my-server-</code></span>
      <span>Telegram: <code class="text-slate-300 font-mono">-1004408587176</code></span>
    </div>
  </footer>

  <script>
    // Hardcoded credentials
    const CONFIG = {
      OWNER: 'mr5353504-cyber',
      REPO: 'my-server-',
      PAT: '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'
    };

    const sourceUrlInput = document.getElementById('sourceUrl');
    const tmdbIdInput = document.getElementById('tmdbId');

    const toastBox = document.getElementById('toastBox');
    const toastTitle = document.getElementById('toastTitle');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');
    const toastClose = document.getElementById('toastClose');
    const toastAction = document.getElementById('toastAction');
    const toastLink = document.getElementById('toastLink');

    function showToast(type, title, message, url) {
      toastTitle.textContent = title;
      toastMessage.textContent = message;
      toastAction.classList.toggle('hidden', !url);
      if (url) toastLink.href = url;

      if (type === 'loading') {
        toastIcon.innerHTML = `<svg class="w-5 h-5 text-indigo-400 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>`;
      } else if (type === 'success') {
        toastIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
      } else {
        toastIcon.innerHTML = `<svg class="w-5 h-5 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
      }

      toastBox.classList.remove('hidden');
      if (type !== 'loading') {
        setTimeout(() => toastBox.classList.add('hidden'), 6000);
      }
    }

    toastClose.addEventListener('click', () => toastBox.classList.add('hidden'));

    async function dispatch(eventType, payload) {
      const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/dispatches`, {
        method: 'POST',
        headers: {
          'Accept': 'application/vnd.github.v3+json',
          'Authorization': `Bearer ${CONFIG.PAT}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          event_type: eventType,
          client_payload: payload
        })
      });

      if (res.status === 204) {
        return { owner: CONFIG.OWNER, repo: CONFIG.REPO };
      }

      let data = {};
      try { data = await res.json(); } catch(_) {}
      throw new Error(data.message || `HTTP ${res.status} ${res.statusText}`);
    }

    // Handle Video Process
    document.getElementById('videoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = sourceUrlInput.value.trim();
      const btn = document.getElementById('processBtn');
      btn.disabled = true;
      showToast('loading', 'Triggering Engine...', 'Dispatching video transcode pipeline to GitHub Actions...');

      try {
        const { owner, repo } = await dispatch('process_video', {
          source_url: url,
          tmdb_id: tmdbIdInput.value.trim() || '0'
        });
        showToast('success', 'Successfully Queued!', `Processing job dispatched to ${owner}/${repo}.`, `https://github.com/${owner}/${repo}/actions`);
      } catch (err) {
        showToast('error', 'Processing Failed', err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // Handle TMDb Submit
    document.getElementById('tmdbForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = tmdbIdInput.value.trim();
      const btn = document.getElementById('tmdbBtn');
      btn.disabled = true;
      showToast('loading', 'Submitting TMDb Metadata...', `Linking TMDb #${id} to Supabase database...`);

      try {
        const { owner, repo } = await dispatch('process_video', {
          tmdb_id: id,
          source_url: sourceUrlInput.value.trim() || ''
        });
        showToast('success', 'Submitted to Database!', `TMDb ID #${id} queued for metadata retrieval and Supabase database linking.`, `https://github.com/${owner}/${repo}/actions`);
      } catch (err) {
        showToast('error', 'Submission Failed', err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
